<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List</title>
</head>
<body>
  <h1>List</h1>
  <h2>Ordered List</h2>
  <h1>List of countries</h1>
  <ol>
    <li>Kenya</li>
    <li>Uganda</li>
    <li>Tanzania</li>
    <li>Burundi</li>
    <li>Somalia</li>
  </ol>
  <h1>Unordered List</h1>
  <h2>List of Fruits</h2>
  <ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Orange</li>
    <li>Grape</li>
    <li>Strawberry</li>
  </ul>
  <h2>Description List</h2>
  <dl>
    <dt>Apple</dt>
    <dd>A round fruit with red skin.</dd>
    <dt>Banana</dt>
    <dd>A long yellow fruit.</dd>
  </dl>

</body>
</html>
